# Hostinger shared hosting pulls from git but never runs composer or npm. This
# workflow does both, then publishes a ready-to-serve tree to the `production`
# branch that Hostinger tracks. `master` stays clean source.
name: Test & publish production branch

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # Must not exceed the PHP version selected in hPanel.
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install and build frontend
        run: |
          npm ci
          npm run build

      - name: Assert Vite manifest exists
        # A missing manifest is what takes every @vite page down in production.
        run: test -f public/build/manifest.json

      - name: Assert routes are cacheable
        # route:cache fails on closure routes; catching that here beats catching it
        # during the post-deploy SSH step.
        run: php artisan route:cache && php artisan route:clear

      - name: Run tests
        run: php artisan test

  publish:
    name: Publish to production branch
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build production dependencies and assets
        run: |
          cp .env.example .env
          composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-progress
          npm ci
          npm run build

      - name: Stage the deployable tree
        run: |
          rm -rf /tmp/deploy && mkdir -p /tmp/deploy
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='tests' \
            ./ /tmp/deploy/

      - name: Commit to production branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep production's history linear and appendable. Force-pushing here would
          # break Hostinger's `git pull` with a non-fast-forward on every deploy.
          if git ls-remote --exit-code --heads origin production >/dev/null 2>&1; then
            git fetch origin production
            git checkout -f -B production origin/production
          else
            git checkout --orphan production
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a /tmp/deploy/ ./

          # Deploy-branch ignore list. vendor/ and public/build ARE committed here;
          # runtime state and client uploads must never be touched by a pull.
          cat > .gitignore <<'IGNORE'
          /node_modules
          .env
          .env.backup
          /public/uploads/*
          !/public/uploads/.gitkeep
          /public/hot
          /storage/*.key
          /storage/logs/*.log
          /storage/framework/cache/data/*
          /storage/framework/sessions/*
          /storage/framework/views/*
          /bootstrap/cache/*.php
          IGNORE

          git add -A
          if git diff --cached --quiet; then
            echo "No deployable changes."
            exit 0
          fi
          git commit -m "build: deploy ${GITHUB_SHA::7}

          Built from ${GITHUB_SHA} by ${GITHUB_WORKFLOW}."
          git push origin production
